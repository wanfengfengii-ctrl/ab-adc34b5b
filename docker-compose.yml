services:
  indexing-api:
    build: .
    image: powder-indexing-api:latest
    environment:
      # Secret used to sign result certificates. Override in real deployments.
      CERT_SECRET: ${CERT_SECRET:-dev-only-cert-secret-change-me}
    ports:
      # Host port is configurable via INDEXING_PORT (default 8080).
      - "${INDEXING_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; port=os.environ.get('PORT','8080'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # One-shot acceptance gate. Builds the same image and runs the real solver
  # and real certificate verification against a fixed battery; the container
  # exits 0 only when every check passes.
  #   docker compose --profile acceptance run --rm acceptance
  acceptance:
    profiles: ["acceptance"]
    build: .
    image: powder-indexing-api:latest
    environment:
      CERT_SECRET: ${CERT_SECRET:-dev-only-cert-secret-change-me}
    command: ["python", "-m", "app.acceptance"]
    restart: "no"
